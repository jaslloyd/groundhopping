<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Groundhopping Map</title>
  <meta name="description" content="Map of Leinster Senior League football games">
  <meta name="theme-color" content="#1f7a4a">

  <!-- The card shown when a link to the site is shared. The image has to be an absolute URL.
       It's the same card for every link: GitHub Pages serves one static page, and the crawlers
       that build these cards don't run the JavaScript that opens a particular game. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Groundhopping">
  <meta property="og:title" content="Groundhopping">
  <meta property="og:description" content="A map of the Leinster Senior League football games I go to - the grounds, the clubs and the photos.">
  <meta property="og:url" content="https://jaslloyd.github.io/groundhopping/">
  <meta property="og:image" content="https://jaslloyd.github.io/groundhopping/docs/screenshot.png">
  <meta property="og:image:width" content="1226">
  <meta property="og:image:height" content="760">
  <meta property="og:image:alt" content="Groundhopping map showing games around Dublin">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <!-- Fails harmlessly when the page is opened straight from disk. -->
  <link rel="manifest" href="manifest.json">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <aside class="sidebar">
    <h1>Groundhopping</h1>
    <p class="subtitle" id="subtitle"></p>
    <div class="stats" id="stats"></div>

    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="games">Games</button>
      <button role="tab" aria-selected="false" data-tab="clubs">Clubs</button>
      <button role="tab" aria-selected="false" data-tab="grounds">Grounds</button>
      <button role="tab" aria-selected="false" data-tab="numbers">Numbers</button>
    </div>
    <div id="games" role="tabpanel"></div>
    <div id="clubs" role="tabpanel" hidden></div>
    <div id="grounds" role="tabpanel" hidden></div>
    <div id="numbers" role="tabpanel" hidden></div>
  </aside>

  <div id="map"></div>

  <dialog id="lightbox" aria-label="Game photos">
    <img alt="">
    <p></p>
    <button class="lightbox-prev" aria-label="Previous photo">‹</button>
    <button class="lightbox-next" aria-label="Next photo">›</button>
    <button class="lightbox-close" aria-label="Close">✕</button>
  </dialog>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <!-- Data is plain .js (not .json) so the page also works opened straight from disk. -->
  <script src="data/grounds.js"></script>
  <script src="data/crests.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
