<style>
/* Layout: full-height map with a fixture-list sidebar (stacks under the map on phones) */
:root{--bg:#f3f5f1;--panel:#ffffff;--ink:#17211b;--muted:#5d6b62;--line:#dbe2dc;--pitch:#1f7a4a;--pin:#c8102e;
--display:"Barlow Condensed","Arial Narrow",sans-serif;--body:"Source Sans 3",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#101612;--panel:#18211b;--ink:#e6ede8;--muted:#9aa89f;--line:#2a362e;--pitch:#3fb27a;--pin:#ff4d63;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);display:grid;grid-template-columns:340px 1fr;grid-template-rows:100%}
aside{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:20px 16px}
h1{font:700 30px/1 var(--display);letter-spacing:.01em;text-transform:uppercase;margin:0 0 6px;color:var(--pitch)}
.sub{color:var(--muted);margin:0 0 16px;font-variant-numeric:tabular-nums}
.stats{display:flex;gap:18px;margin:0 0 18px}
.stats div{font:700 26px/1 var(--display)}.stats span{display:block;font:600 11px/1.4 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.month{font:600 12px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
button.game{all:unset;display:grid;grid-template-columns:52px 1fr;gap:8px;width:100%;padding:8px 6px;border-radius:6px;cursor:pointer;border-bottom:1px solid var(--line)}
button.game:hover,button.game:focus-visible{background:color-mix(in srgb,var(--pitch) 12%,transparent);outline:none}
.d{font:600 13px/1.3 var(--display);color:var(--muted);font-variant-numeric:tabular-nums;text-transform:uppercase}
.t{font-weight:600}.g{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;margin:0 0 14px;border-bottom:1px solid var(--line)}
.tabs button{all:unset;cursor:pointer;padding:8px 12px;font:700 15px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--pitch);border-color:var(--pitch)}
.tabs button:focus-visible{outline:2px solid var(--pitch);outline-offset:2px}
.crests{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.club{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:10px 4px;border-radius:8px;border:1px solid var(--line)}
.club:hover,.club:focus-visible,.club.on{background:color-mix(in srgb,var(--pitch) 12%,transparent);outline:none}
.club img,.badge{width:56px;height:56px;object-fit:contain}
.badge{border-radius:50%;display:grid;place-items:center;font:700 20px/1 var(--display);color:#fff;background:var(--c);border:2px dashed color-mix(in srgb,var(--ink) 25%,transparent)}
.club .n{font:600 13px/1.2 var(--body)}.club .c{font:700 12px/1 var(--display);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.cgames{grid-column:1/-1;background:var(--bg);border-radius:8px;padding:8px 12px;font-size:13px}.cgames ul{margin:4px 0 0;padding-left:16px}
.cgames li{cursor:pointer}.cgames li:hover{color:var(--pitch)}
.reset{background:var(--panel);color:var(--ink);border:0;border-radius:6px;padding:8px 12px;font:700 14px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;box-shadow:0 1px 5px rgba(0,0,0,.35);cursor:pointer}.reset b{color:var(--pitch)}
.hint{color:var(--muted);font-size:12px;margin:12px 0 0}
#map{height:100%}
.leaflet-popup-content{font:14px/1.4 var(--body)}.leaflet-popup-content b{font:700 17px/1.2 var(--display);text-transform:uppercase;color:#1f7a4a}
.leaflet-popup-content ul{padding-left:16px;margin:6px 0 0}
.pin{background:var(--pin);color:#fff;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;font:700 13px/1 var(--display);box-shadow:0 1px 4px rgba(0,0,0,.4)}
@media (max-width:760px){body{grid-template-columns:1fr;grid-template-rows:55vh auto;height:auto}#map{height:55vh;order:-1}aside{border-right:0;overflow:visible}}
</style></head><body>

const map=L.map('map',{zoomControl:true});

  m.bindPopup(`<b>${g.name}</b><ul>${g.games.map(x=>`<li>${fmt(x.date)} ${x.date.slice(0,4)} · ${x.title}</li>`).join('')}</ul>`);
  markers[i]=m;

map.fitBounds(L.featureGroup(markers).getBounds().pad(0.1));
const games=grounds.flatMap((g,i)=>g.games.map(x=>({...x,gi:i,gname:g.name}))).sort((a,b)=>b.date.localeCompare(a.date));

let html='',last='';
games.forEach(x=>{const mo=new Date(x.date+'T12:00').toLocaleDateString('en-IE',{month:'long',year:'numeric'});

const notClub=/Pre-season|Representative|Charity|Played|Park$|League decider|Noely|Lonergan|Selection|Grangegorman/;
const byClub={};games.forEach(x=>{if(x.keywords.includes('Charity match'))return;x.keywords.filter(k=>!notClub.test(k)).forEach(k=>(byClub[k]??=[]).push(x))});
const ini=n=>n.replace(/\b(FC|AFC|CY)\b/g,'').split(/\s+/).filter(w=>/^[A-Z]/.test(w)).map(w=>w[0]).join('').slice(0,3);
const hue=n=>[...n].reduce((a,c)=>a*31+c.charCodeAt(0)>>>0,7)%360;
const cl=document.getElementById('clubs');
const names=Object.keys(byClub).sort((a,b)=>byClub[b].length-byClub[a].length||a.localeCompare(b));
cl.innerHTML='<div class="crests">'+names.map(n=>`<button class="club" data-n="${n}">${crests[n]?`<img src="${crests[n]}" alt="">`:`<span class="badge" style="--c:hsl(${hue(n)} 45% 38%)">${ini(n)}</span>`}<span class="n">${n}</span><span class="c">${byClub[n].length} game${byClub[n].length>1?'s':''}</span></button>`).join('')+'</div><p class="hint">'+Object.keys(crests).length+' of '+names.length+' crests found · dashed badges are placeholders</p>';
const pin=(n,hi)=>L.divIcon({className:'',html:`<div class="pin" style="width:${n>1?30:24}px;height:${n>1?30:24}px${hi?';background:var(--pitch)':''}">${n}</div>`,iconSize:[n>1?30:24,n>1?30:24]});
const resetCtl=L.control({position:'topright'});resetCtl.onAdd=()=>{const b=L.DomUtil.create('button','reset');L.DomEvent.disableClickPropagation(b);b.onclick=()=>{cl.querySelector('.cgames')?.remove();cl.querySelectorAll('.club.on').forEach(x=>x.classList.remove('on'));showAll()};return b};
function filterMap(n){map.closePopup();const vis=[];grounds.forEach((g,i)=>{const k=byClub[n].filter(x=>x.gi===i);const m=markers[i];
  if(!k.length){m.remove();return}m.setIcon(pin(k.length,1));m.setPopupContent(`<b>${g.name}</b><ul>${k.map(x=>`<li>${fmt(x.date)} ${x.date.slice(0,4)} · ${x.title}</li>`).join('')}</ul>`);m.addTo(map);vis.push(m)});
  resetCtl.remove();resetCtl.addTo(map);resetCtl.getContainer().innerHTML=`<b>${n}</b> · ${byClub[n].length} game${byClub[n].length>1?'s':''} &nbsp;✕ Show all`;
  vis.length===1?map.flyTo(vis[0].getLatLng(),14,{duration:.8}):map.flyToBounds(L.featureGroup(vis).getBounds().pad(0.25),{duration:.8,maxZoom:14});
  if(innerWidth<=760)scrollTo({top:0,behavior:'smooth'})}
function showAll(){map.closePopup();resetCtl.remove();grounds.forEach((g,i)=>{const m=markers[i];m.setIcon(pin(g.games.length));
  m.setPopupContent(`<b>${g.name}</b><ul>${g.games.map(x=>`<li>${fmt(x.date)} ${x.date.slice(0,4)} · ${x.title}</li>`).join('')}</ul>`);m.addTo(map)});
  map.flyToBounds(L.featureGroup(markers).getBounds().pad(0.1),{duration:.8})}
cl.addEventListener('click',e=>{const li=e.target.closest('.cgames li');if(li){const m=markers[+li.dataset.gi];map.flyTo(m.getLatLng(),15,{duration:.8});m.openPopup();if(innerWidth<=760)scrollTo({top:0,behavior:'smooth'});return}
  const b=e.target.closest('.club');if(!b)return;const grid=cl.firstChild;grid.querySelector('.cgames')?.remove();
  const was=b.classList.contains('on');grid.querySelectorAll('.club.on').forEach(x=>x.classList.remove('on'));if(was){showAll();return}b.classList.add('on');
  const cols=getComputedStyle(grid).gridTemplateColumns.split(' ').length,items=[...grid.children],idx=items.indexOf(b),end=Math.min(items.length-1,idx-idx%cols+cols-1);
