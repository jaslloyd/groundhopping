<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Groundhopping Map</title>
  <meta name="description" content="Map of Leinster Senior League football games">
  <meta name="theme-color" content="#1f7a4a">

  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <aside class="sidebar">
    <h1>Groundhopping</h1>
    <p class="subtitle" id="subtitle"></p>
    <div class="stats" id="stats"></div>

    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="games">Games</button>
      <button role="tab" aria-selected="false" data-tab="clubs">Clubs</button>
    </div>
    <div id="games" role="tabpanel"></div>
    <div id="clubs" role="tabpanel" hidden></div>
  </aside>

  <div id="map"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <!-- Data is plain .js (not .json) so the page also works opened straight from disk. -->
  <script src="data/grounds.js"></script>
  <script src="data/crests.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
